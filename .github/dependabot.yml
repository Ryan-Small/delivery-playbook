# Dependabot configuration. Companion to docs/procedure.md.
#
# Design rules this file encodes:
#   1. No target-branch. Everything targets the default branch (main).
#      Security updates always use the default branch regardless of config.
#   2. Cooldown delays VERSION updates so a freshly published (possibly
#      compromised) release is not pulled in on day one. Cooldown never
#      applies to SECURITY updates, so fixes are not delayed.
#   3. Security updates are grouped into two groups per ecosystem,
#      security-minor-patch and security-major. The group name is how the
#      tier workflow recognises a security update, and only the first group
#      may auto-merge. Routine updates are grouped to cut noise; majors stay
#      ungrouped so each gets its own human review.
#   4. The tier (A, B or C) is decided by .github/workflows/tiered-automerge.yml
#      from the group name and the update type, not by labels.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development:
        applies-to: version-updates
        dependency-type: "development"
      # Routine majors: intentionally no group, one pull request per dependency.
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-major:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # Recorded exception (2026-11-01): TypeScript 7 is published, but
      # typescript-eslint's peer range is still below 6.1, so Dependabot cannot
      # resolve the update and the whole npm job reports a failure every run.
      # Remove this entry when typescript-eslint supports TypeScript 7; the
      # major then arrives as a normal Tier C pull request.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-major:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    cooldown:
      default-days: 7
