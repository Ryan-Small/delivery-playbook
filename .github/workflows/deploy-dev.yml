# dev tracks main: every merge builds the image once and points dev at it.
name: Deploy dev

on:
  push:
    branches: [main]

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write

  dev:
    needs: build
    uses: ./.github/workflows/promote.yml
    permissions:
      contents: read
      packages: write
    with:
      environment: dev
      release: main
      digest: ${{ needs.build.outputs.digest }}
