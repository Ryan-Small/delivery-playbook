# Tiered handling of Dependabot pull requests.
#
# Tiers (docs/procedure.md section 4):
#   A  security update in the `security-minor-patch` group with no package on
#      the critical list -> automated approval and auto-merge on green checks.
#   B  security update that is a major, or that touches the critical list
#      -> a named reviewer, within the remediation timeline.
#   C  routine version update -> reviewed and prioritised at the weekly triage.
#
# Detection: .github/dependabot.yml puts every security fix into one of two
# groups per ecosystem. The group name is written by Dependabot, so a
# dependency cannot set it. Anything outside the minor/patch security group is
# a person's decision. Every check that fails routes to a person; nothing
# merges by default.
#
# Preconditions enforced elsewhere: "Allow auto-merge" on; the ruleset on main
# requires a pull request, 1 approval and the CI checks (the approval below is
# that one approval, and the checks still gate the merge); the `security`
# label exists.
#
# The @dependabot merge comment commands were removed on 2026-01-27, so
# `gh pr merge --auto` is the supported mechanism.
name: Tiered auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

env:
  # Dependencies that always need a human (Tier B), one per line, exact names.
  # react-markdown renders content into the page, so a change in how it
  # sanitises input is a security-relevant change.
  CRITICAL_LIST: |
    react-markdown
  # The Dependabot group whose members may auto-merge.
  SECURITY_GROUP: security-minor-patch

jobs:
  tier:
    name: tier
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label security pull requests for the release notes
        # Dependabot applies no `security` label of its own; the workflow does.
        if: startsWith(steps.meta.outputs.dependency-group, 'security-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label security

      - name: Decide tier
        id: tier
        env:
          GROUP: ${{ steps.meta.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -euo pipefail
          tier=C; reason="routine version update, reviewed at triage"
          if [ "$GROUP" = "$SECURITY_GROUP" ]; then
            tier=A; reason="security update, patch or minor, no critical-list package"
            case "$UPDATE_TYPE" in
              version-update:semver-patch|version-update:semver-minor) ;;
              *) tier=B; reason="security update with update type $UPDATE_TYPE" ;;
            esac
            IFS=',' read -ra names <<< "$DEP_NAMES"
            for n in "${names[@]}"; do
              n="$(echo "$n" | xargs)"
              if grep -qx "$n" <<< "$CRITICAL_LIST"; then tier=B; reason="$n is on the critical list"; fi
            done
          elif [[ "$GROUP" == security-* ]]; then
            tier=B; reason="security group '$GROUP' always needs a reviewer"
          fi
          echo "Tier $tier for [$DEP_NAMES] ($UPDATE_TYPE, group '${GROUP:-none}'): $reason"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Approve and enable auto-merge (Tier A only)
        if: steps.tier.outputs.tier == 'A'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.tier.outputs.reason }}
          DEP_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Tier A automated approval under docs/procedure.md section 4: $REASON ($DEP_NAMES). Verification = required CI checks on this pull request."
          gh pr merge --auto --squash "$PR_URL"
