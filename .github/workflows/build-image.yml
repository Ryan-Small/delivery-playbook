# Reusable: build the container image for the calling workflow's commit,
# exactly once. If an image tagged sha-<short> already exists for this
# commit, reuse its digest instead of building again. This is what makes
# "the artifact validated in staging is the artifact in production" true.
name: Build image

on:
  workflow_call:
    outputs:
      digest:
        description: Digest of the image for this commit
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: build-once
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Identify the commit and image
        id: meta
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${commit:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "build-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse the image if this commit was already built
        id: existing
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          if digest="$(docker buildx imagetools inspect "$REF" --format '{{ .Manifest.Digest }}' 2>/dev/null)"; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Reusing $REF@$digest"
          else
            echo "digest=" >> "$GITHUB_OUTPUT"
            echo "No image for this commit yet; building."
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.digest == ''

      - name: Build and push once
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            APP_COMMIT=${{ steps.meta.outputs.commit }}
            APP_BUILD_TIME=${{ steps.meta.outputs.build-time }}

      - name: Resolve the digest
        id: resolve
        env:
          EXISTING: ${{ steps.existing.outputs.digest }}
          BUILT: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING:-$BUILT}"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Image for ${{ steps.meta.outputs.commit }} is $digest"
