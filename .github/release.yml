# Groups pull requests in auto-generated release notes. Labels come from
# Dependabot (dependencies, security) and from the pull request template.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security updates
      labels:
        - security
    - title: Fixes
      labels:
        - bug
        - hotfix
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Dependency updates
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
